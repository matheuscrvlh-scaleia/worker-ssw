# worker-ssw na VPS: worker-ssw (Fastify + BullMQ) + o seu Redis. Runbook: docs/deploy.md.
# Variáveis em .env (fora do git; modelo em .env.example).
#
#   docker compose config --quiet                 # confere a interpolação
#   docker compose up -d                          # sobe (ou atualiza para IMAGEM_TAG)
#   docker compose run --rm worker-ssw dist/main.js reconstruir-projecoes --todas
#
# Redes:
#   erp-interna — EXTERNA, criada pelo ERP: o Caddy e a API do ERP chegam ao worker-ssw por ela
#                 (http://worker-ssw:3003). Sem saída para a internet.
#   dados       — worker-ssw ↔ redis. Sem saída para a internet.
#   saida       — worker-ssw → Postgres (Supabase), SSW e SFTP.
# Nenhuma porta publicada: quem expõe /api/public/* é o Caddy do ERP.

name: worker-ssw

x-log: &log
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    tag: "{{.Name}}"

# Endurecimento comum: raiz somente leitura, sem capability, sem escalar privilégio.
x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *log

services:
  worker-ssw:
    <<: *endurecido
    image: ${REGISTRO:-ghcr.io/dono/worker-ssw}/worker-ssw:${IMAGEM_TAG:?defina IMAGEM_TAG no .env}
    build:
      context: .
    init: true
    environment:
      NODE_ENV: production
      LOG_NIVEL: ${LOG_NIVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (papel erp_worker) no .env}
      DB_MAX_CONEXOES: ${DB_MAX_CONEXOES:-5}
      DB_TIMEOUT_CONSULTA_MS: ${DB_TIMEOUT_CONSULTA_MS:-120000}
      REDIS_URL: redis://:${REDIS_SENHA:?defina REDIS_SENHA no .env}@redis:6379/0
      PORTA: "3003"
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-1}
      WORKERS_LIGADOS: ${WORKERS_LIGADOS:-true}
      # Desligados até a virada: o sistema atual ainda faz a ingestão.
      AGENDAMENTOS_LIGADOS: ${AGENDAMENTOS_LIGADOS:-false}
      INGESTAO_JOBS_LIGADOS: ${INGESTAO_JOBS_LIGADOS:-}
      INTERNO_TOKENS: ${INTERNO_TOKENS:?defina INTERNO_TOKENS no .env}
      METRICAS_TOKEN:
      SEGREDOS_CHAVES: ${SEGREDOS_CHAVES:?defina SEGREDOS_CHAVES no .env}
      SEGREDOS_CHAVE_ATUAL: ${SEGREDOS_CHAVE_ATUAL:-1}
      SFTP_HOST:
      SFTP_PORTA:
      SFTP_USUARIO:
      SFTP_SENHA:
      SFTP_IMPRESSAO_DIGITAL:
    volumes:
      # CA do Supabase para sslmode=verify-full (a mesma do ERP).
      - ./certs:/etc/erp/certs:ro
    tmpfs:
      # Arquivos do FTP em trânsito (o 455 tem ~39 MB).
      - /tmp:size=512m
    networks: [erp-interna, dados, saida]
    depends_on:
      redis: { condition: service_healthy }
    deploy:
      # Uma réplica: o agendador e as travas contam com um processo só ligando os crons.
      replicas: 1
      resources:
        limits: { cpus: "${WORKER_CPUS:-1.5}", memory: "${WORKER_MEMORIA:-1536M}" }
        reservations: { memory: 384M }
    # SIGTERM: para de aceitar HTTP e de pegar job, espera os em andamento (até 30 s; main.ts).
    # O BullMQ devolve para a fila o que não terminar.
    stop_grace_period: 40s

  redis:
    <<: *endurecido
    image: ${REDIS_IMAGEM:-redis:7.4.12-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7}
    # Usuário redis da imagem (sem root, sem gosu/chown no entrypoint).
    user: "999:1000"
    environment:
      REDIS_SENHA: ${REDIS_SENHA:?defina REDIS_SENHA no .env}
    # A senha entra pelo ambiente (o Redis troca o título do processo, então ela não aparece no ps).
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$$REDIS_SENHA"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_dados:/data
    tmpfs:
      - /tmp:size=8m
    networks: [dados]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_SENHA" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        # maxmemory 384mb (redis.conf) + folga para o fork da persistência.
        limits: { cpus: "0.5", memory: 512M }
    stop_grace_period: 30s

networks:
  erp-interna:
    external: true
  dados:
    internal: true
  saida: {}

volumes:
  redis_dados: {}
