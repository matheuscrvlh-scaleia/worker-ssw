# Redis do worker-ssw: filas do BullMQ, travas, fila de aplicação, token do SSW cifrado e
# limites de taxa. Montado somente leitura em /usr/local/etc/redis/redis.conf. A senha NÃO fica
# aqui: o compose passa --requirepass a partir de REDIS_SENHA (.env).

# Só na rede interna "dados" do compose (nenhuma porta publicada); com senha, o protected-mode
# deixa as outras redes do contêiner conectarem.
bind 0.0.0.0
protected-mode yes
port 6379

# BullMQ exige noeviction: sob pressão de memória o Redis recusa escrita (erro visível no log
# do worker-ssw) em vez de apagar job em silêncio. O teto fica abaixo do limite do contêiner
# para sobrar memória ao fork do BGSAVE/BGREWRITEAOF.
maxmemory 384mb
maxmemory-policy noeviction

# Persistência: AOF (fsync a cada segundo; perde no máximo ~1 s de jobs numa queda) com
# preâmbulo RDB, mais snapshot RDB periódico.
dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 3600 1 300 100 60 10000

# Comandos que só servem para derrubar ou espionar a instância.
rename-command DEBUG ""
rename-command MONITOR ""

# Logs no stdout (o Docker rotaciona).
logfile ""
loglevel notice
